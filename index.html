function tileAt(wx,wy){let x=Math.floor(wx/T),y=Math.floor(wy/T);return x<0||y<0||x>=COLS||y>=ROWS?5:tiles[y][x]}
function solid(wx,wy){if(tileAt(wx,wy)===5)return true;let fx=34*T+16,fy=23*T+16;if(Math.abs(wx-fx)<51&&Math.abs(wy-fy)<34)return true;for(const h of houses){let hx=h.x*T,hy=h.y*T;if(wx>hx-5&&wx<hx+110&&wy>hy-12&&wy<hy+87)return true}for(const t of trees){if(hypot(wx-t.x,wy-(t.y-7))<14)return true}return false}
function playerMove(dt){let vx=control.vx,vy=control.vy;let k=control.keys;if(k.has('a')||k.has('arrowleft'))vx=-1;if(k.has('d')||k.has('arrowright'))vx=1;if(k.has('w')||k.has('arrowup'))vy=-1;if(k.has('s')||k.has('arrowdown'))vy=1;let speed=(control.run||k.has('shift')?185:116)*dt,mag=hypot(vx,vy);if(mag>1){vx/=mag;vy/=mag}if(mag>.13){let nx=player.x+vx*speed,ny=player.y+vy*speed;if(!solid(nx,player.y+10)&&!solid(nx-7,player.y+8)&&!solid(nx+7,player.y+8))player.x=nx;if(!solid(player.x,ny+10)&&!solid(player.x-7,ny+8)&&!solid(player.x+7,ny+8))player.y=ny;player.step+=dt*(control.run?14:10);if(Math.abs(vx)>Math.abs(vy))player.dir=vx>0?1:3;else player.dir=vy>0?2:0}}
function updateNPCs(dt){for(const n of npcs){n.timer-=dt;if(n.timer<=0){n.timer=rand(1.3,3.6);const ang=rand(0,Math.PI*2);n.tx=Math.cos(ang);n.ty=Math.sin(ang)}let nx=n.x+n.tx*dt*16,ny=n.y+n.ty*dt*16;if(!solid(nx,ny+12)&&Math.abs(nx-player.x)+Math.abs(ny-player.y)>22){n.x=nx;n.y=ny;n.walk+=dt*5}else{n.tx*=-1;n.ty*=-1}n.dir=Math.abs(n.tx)>Math.abs(n.ty)?(n.tx>0?1:3):(n.ty>0?2:0)}}
function nearest(){let near=null,dist=83;for(const b of [...booths,champ]){let d=hypot(player.x-(b.x*T+16),player.y-(b.y*T+14));if(d<dist){dist=d;near=b}}for(const n of npcs){let d=hypot(player.x-n.x,player.y-n.y);if(d<dist){dist=d;near={id:'npc',name:n.name,npc:n}}}return near}

function finishChampionship(){const cs=game.championship;let rank=1+cs.opponents.filter(x=>x.score>cs.score).length;if(rank===1){save.wins++;save.title='Fiesta Champion';save.gold=true;addAchievement('Champion Crown')}else if(rank===2&&save.title!=='Fiesta Champion')save.title='Fiesta Star';else if(rank>2&&save.title==='Fiesta Guest')save.title='Fiesta Challenger';save.best=Math.max(save.best,cs.score);saveGame();const sorted=[{name:'YOU',score:cs.score},...cs.opponents].sort((a,b)=>b.score-a.score);panel(header('THE FINALS',rank===1?'🏆 FIESTA CHAMPION!':'🏆 CHAMPIONSHIP RESULTS')+`<p class="prize">${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'🎖️'}</p><div class="report"><strong>${rank===1?'1st':rank===2?'2nd':rank===3?'3rd':'4th'} PLACE</strong><p>Your final score: <b>${cs.score}</b></p><p>${rank===1?'You earned the golden outfit and Fiesta Champion title!':rank===2?'You earned the Fiesta Star title!':'Practice your favorite booths and challenge the arena again!'}</p></div>${sorted.map((s,i)=>`<div class="boothInfo"><b>${i+1}. ${s.name}</b><b>${s.score} pts</b></div>`).join('')}<button class="btn" data-action="close">RETURN TO PLAZA</button>`)}

function numQ(prompt,ans,topic,spread=4,suffix=''){

 while(vals.length<4&&tries++<60){let offset=ri(-spread,spread);if(offset===0)continue;let v=ans+offset;if(!vals.includes(v))vals.push(v)}

}

function throwSkill(m,aim){if(m.moving||m.shot||m.attempts>=m.maxThrows)return;

 const wind=m.wind*acc*15;
 let finalX=aim.x+wind+mis*55*acc;
 let finalY=aim.y+Math.abs(mis)*55*acc;
 if(m.type==='ring'){
  m.shot={x:360,y:315,sx:360,sy:315,tx:finalX,ty:finalY,t:0,dur:.76,kind:'ring'};
 }else if(m.type==='tumba'){
  m.shot={x:140,y:282,sx:140,sy:282,tx:finalX,ty:finalY,t:0,dur:.73,kind:'slipper',guardChecked:false,blocked:false};
 }else if(m.type==='holen'){
  let dx=aim.x-m.marble.x,dy=aim.y-m.marble.y,d=hypot(dx,dy)||1;
  let v=200+Math.min(620,d*1.85)*(0.68+power*.60);
  m.marble.vx=dx/d*v;m.marble.vy=dy/d*v;m.marble.active=true;m.moving=true;
 } m.attempts++;m.aim=null;updateMiniHUD(m)
}

 const prize=m.pieces.find(p=>Math.abs((p.x+Math.sin(p.phase)*17)-m.clawX)<(m.mathHits>=2?28:17));
 if(prize){m.grabResult=prize;prize.caught=true;miniMessage(prize.good?'A prize in reach!':'Careful: that is a gray decoy!')}

 if(m.type==='sungka'){oldUpdateMini(m,dt);return}
 if(!mini||mini!==m||m.finished)return;
 m.time+=dt;m.skillClock+=dt;wSparks(m,dt);
 if(['ring','tumba','holen'].includes(m.type))m.power=.5+.5*Math.sin(m.skillClock*4.7);

  if(m.shot){let s=m.shot;s.t=Math.min(1,s.t+dt/s.dur);s.x=s.sx+(s.tx-s.sx)*s.t;s.y=s.sy+(s.ty-s.sy)*s.t;

     if(Math.abs(s.x-m.guardX)<(m.mathHits>=2?25:36)){s.blocked=true;miniMessage('The patrolling guard blocked your slipper!')}
   }
   if(s.t>=1){m.shot=null;m.moving=false;let hit=!s.blocked&&hypot(s.tx-510,s.ty-170)<(23+m.mathHits*1.4);
    if(hit){m.canHits++;m.points+=m.canHits>=2?70:35;m.hits++;emitBurst(m,510,150,'#ffe188',18);miniMessage(m.canHits>=2?'Tin can toppled! Amazing throw!':'Good hit! Strike again to topple the can!');if(m.canHits>=2){m.canDown=true;finishMini(m,'You toppled the can in two strikes!');return}}

 }else if(m.type==='holen'){

   }
   for(const b of m.targets){if(b.out)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.exp(-1.05*dt);b.vy*=Math.exp(-1.05*dt);

// ================= VERSION 1.7: ORIGINAL FIESTA MUSIC + CLEAN TITLE =================
// Never load or imitate commercial soundtrack files. All music is synthesized locally.
// The iPad must receive a tap before audio begins; sound is off until enabled.
const fiestaMusic = (() => {
 const melody = [
  72,null,76,79,76,74,72,null,
  69,72,74,null,76,79,81,null,
  79,76,74,72,69,null,72,74,
  76,null,79,76,74,72,67,null
 ];
 // Original 8-chord village-fiesta loop, with a simple syncopated rhythm.
 const chords = [
  [48,60,64,67],[53,60,65,69],[55,62,67,71],[48,60,64,67],
  [57,60,64,69],[53,60,65,69],[55,62,67,71],[48,60,64,67]
 ];
 const stepTime = 60 / 112 / 2;
 let bus=null,noise=null,timer=null,nextTime=0,step=0,context=null;
 const midiFreq = n => 440 * Math.pow(2,(n-69)/12);
 function audioContext(){
  const Audio = window.AudioContext || window.webkitAudioContext;
  if(!Audio) return null;
  if(!releaseAudio) releaseAudio = new Audio();
  context = releaseAudio;
  if(context.state === 'suspended') {
   const result = context.resume();
   if(result && typeof result.catch === 'function') result.catch(()=>{});
  }
  if(!bus){
   bus=context.createGain();
   bus.gain.value=0;
   bus.connect(context.destination);
  }
  return context;
 }
 function pluck(midi,when,duration,peak,type='triangle'){
  if(!context||!bus) return;
  const osc=context.createOscillator(),env=context.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(midiFreq(midi),when);
  env.gain.setValueAtTime(.0001,when);
  env.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),when+.014);
  env.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(env);env.connect(bus);
  osc.start(when);osc.stop(when+duration+.015);
 }
 function shake(when,strong){
  if(!context||!bus) return;
  if(!noise){
   const rate=context.sampleRate,length=Math.round(rate*.065);
   noise=context.createBuffer(1,length,rate);
   const channel=noise.getChannelData(0);
   for(let i=0;i<length;i++)channel[i]=(Math.random()*2-1);
  }
  const source=context.createBufferSource(),filter=context.createBiquadFilter(),env=context.createGain();
  source.buffer=noise;
  filter.type='highpass';filter.frequency.value=5000;
  env.gain.setValueAtTime(.0001,when);
  env.gain.linearRampToValueAtTime(strong?.025:.012,when+.004);
  env.gain.exponentialRampToValueAtTime(.0001,when+.058);
  source.connect(filter);filter.connect(env);env.connect(bus);
  source.start(when);source.stop(when+.06);
 }
 function schedule(){
  if(!save.soundOn || document.hidden || !context || context.state!=='running') return;
  const targetVolume = mode==='explore' ? .25 : .15;
  bus.gain.setTargetAtTime(targetVolume,context.currentTime,.2);
  if(nextTime<context.currentTime-.3)nextTime=context.currentTime+.065;
  let count=0;
  while(nextTime<context.currentTime+.25 && count++<4){
   const i=step%32, group=Math.floor(i/4), chord=chords[group];
   if(melody[i]!==null){
    pluck(melody[i],nextTime,.19,.105,'triangle');
   }
   if(i%4===0){
    pluck(chord[0]-12,nextTime,.29,.072,'sine');
    pluck(chord[1],nextTime,.28,.023,'triangle');
    pluck(chord[2],nextTime,.28,.019,'triangle');
   }
   if(i%4===2){pluck(chord[0]-12,nextTime,.16,.042,'sine');}
   if(i%2===1 || i%4===0)shake(nextTime,i%4===0);
   nextTime+=stepTime;
   step++;
  }
 }
 function start(){
  if(!save.soundOn) return;
  try{
   const a=audioContext();
   if(!a)return;
   if(timer===null){
    step=0;nextTime=a.currentTime+.065;
    timer=setInterval(schedule,85);
   }
   schedule();
  }catch(err){console.warn('Fiesta audio unavailable:',err);}
 }
 function stop(){
  if(timer!==null){clearInterval(timer);timer=null;}
  if(bus&&context)bus.gain.setTargetAtTime(0,context.currentTime,.025);
 }
 return {start,stop,active:()=>timer!==null};
})();

function fiestaUiSound(kind='tap'){
 if(!save.soundOn || !releaseAudio || releaseAudio.state!=='running')return;
 try{
  const t=releaseAudio.currentTime+.004;
  const os=releaseAudio.createOscillator(),gain=releaseAudio.createGain();
  const hz=kind==='interact'?495:kind==='correct'?790:kind==='wrong'?270:660;
  os.type='sine';os.frequency.setValueAtTime(hz,t);
  os.frequency.exponentialRampToValueAtTime(hz*(kind==='wrong'?.83:1.13),t+.085);
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.032,t+.009);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.125);
  os.connect(gain);gain.connect(releaseAudio.destination);
  os.start(t);os.stop(t+.13);
 }catch(_err){}
}
